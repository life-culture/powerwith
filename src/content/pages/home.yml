    id: begin
    visible: true
    ground: clay
    align: center
    show_mark: true
    italic: true
    line: Influence that keeps the relationship intact.
    body: Begin with the Introduction. It is free.
    form:
      show_first_name: false
      first_name_label: FIRST NAME
      email_label: EMAIL ADDRESS
      email_placeholder: ''
      button: SEND ME THE INTRODUCTION
      source: home-final
    helper: ''
