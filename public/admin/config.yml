# Generated by scripts/cms-config.mjs. Edit that file, then run `npm run cms`.
backend:
  name: github
  repo: life-culture/powerwith
  branch: main
  base_url: https://powerwith.vercel.app
  auth_endpoint: api/auth
  commit_messages:
    update: Update {{collection}} “{{slug}}” from the editor
    uploadMedia: Upload “{{path}}” from the editor
site_url: https://life-culture.github.io/powerwith/
display_url: https://life-culture.github.io/powerwith/
logo:
  src: https://life-culture.github.io/powerwith/favicon.svg
media_folder: public/uploads
public_folder: /uploads
media_libraries:
  default:
    config:
      max_file_size: 25000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2400
          height: 2400
        svg:
          optimize: true
field_defaults:
  richtext:
    minimal: true
    modes:
      - rich_text
    buttons:
      - bold
      - italic
      - link
    editor_components: []
    use_markdown_shortcuts: false
collections:
  - name: pages
    label: Pages
    label_singular: Page
    icon: description
    format: yaml
    description: Every page of the site. Open one, edit, then press Save to publish. Changes go live in about two minutes.
    files:
      - name: home
        label: Home
        file: src/content/pages/home.yml
        fields:
          - name: seo
            label: Search and sharing
            widget: object
            required: false
            fields:
              - name: title
                label: Page title
                widget: string
                required: false
                hint: Shown in the browser tab and search results. Keep under 60 characters.
              - name: description
                label: Search description
                widget: text
                required: false
                hint: Keep under 160 characters.
              - name: social_image
                label: Sharing image
                widget: image
                required: false
                hint: Shown when the page is shared. 1200 by 630 works best.
              - name: noindex
                label: Hide this page from search engines
                widget: boolean
                default: false
                required: false
            collapsed: true
          - name: header
            label: Top bar
            widget: object
            required: false
            fields:
              - name: style
                label: Top bar style
                widget: select
                options:
                  - label: Full navigation
                    value: full
                  - label: Logo and one button
                    value: simple
                  - label: Logo only
                    value: logo
                  - label: None
                    value: none
                default: full
                required: false
              - name: button
                label: Button (for the "Logo and one button" style)
                widget: object
                required: false
                fields:
                  - name: label
                    label: Button text
                    widget: string
                    required: false
                    hint: Capital letters.
                  - name: link
                    label: Where the button goes
                    widget: string
                    required: false
                    hint: >-
                      A page on this site starts with / (for example /preorder). A spot on a page starts with # (for example #contact).
                      Other sites start with https://
                  - name: style
                    label: Button style
                    widget: select
                    options:
                      - label: Primary (filled)
                        value: primary
                      - label: Outline
                        value: outline
                    default: outline
                    required: false
                collapsed: true
            collapsed: true
          - name: footer
            label: Footer
            widget: object
            required: false
            fields:
              - name: style
                label: Footer style
                widget: select
                options:
                  - label: Site footer (from Site settings)
                    value: site
                  - label: Simple footer (set here)
                    value: simple
                default: site
                required: false
              - name: copyright
                label: Copyright line (simple footer)
                widget: string
                required: false
              - name: links
                label: Links (simple footer)
                widget: list
                required: false
                collapsed: true
                fields:
                  - name: label
                    label: Link text
                    widget: string
                    required: false
                  - name: link
                    label: Where it goes
                    widget: string
                    required: false
                    hint: >-
                      A page on this site starts with / (for example /preorder). A spot on a page starts with # (for example #contact).
                      Other sites start with https://
                summary: '{{fields.label}}'
            collapsed: true
          - name: sticky_bar
            label: Phone signup bar
            widget: object
            required: false
            fields:
              - name: visible
                label: Show the bar on phones
                widget: boolean
                default: true
                required: false
              - name: label
                label: Small label
                widget: string
                required: false
              - name: button
                label: Button text
                widget: string
                required: false
              - name: target
                label: Where the button goes
                widget: string
                required: false
                hint: 'Such as #introduction.'
            collapsed: true
          - name: sections
            label: Sections
            widget: list
            required: false
            collapsed: true
            typeKey: type
            types:
              - name: hero_optin
                label: Hero with signup
                widget: object
                summary: Hero with signup · {{fields.title}}
                fields:
                  - name: visible
                    label: Show this section on the page
                    widget: boolean
                    default: true
                    required: false
                    hint: Switch off to hide the section without deleting it.
                  - name: ground
                    label: Background color
                    widget: select
                    options:
                      - label: Obsidian (near black)
                        value: obsidian
                      - label: Bone (warm light)
                        value: bone
                      - label: Umber (warm charcoal)
                        value: umber
                      - label: Oxblood (deep red)
                        value: oxblood
                      - label: Clay (the accent)
                        value: clay
                      - label: Olive (deep green)
                        value: olive
                    default: obsidian
                    required: false
                    hint: Text and button colors switch automatically to match.
                  - name: id
                    label: Section link name
                    widget: string
                    required: false
                    hint: Used for links such as /#framework. Lowercase, no spaces. Leave as is unless you know you need to change it.
                  - name: kicker
                    label: Small label above the headline
                    widget: string
                    required: false
                    hint: Capital letters. Keep under 6 words.
