# Opt-in landing page. Route suggestion /introduction. No site navigation.
# SEO strings are drafts for Sophia to review.

seo:
  title: "Read the Introduction to Power With, free"
  description: "The opening chapter of Power With by Sophia Life. A language for power that changes what you are able to see."

sections:

  - id: header
    type: minimal_header
    visible: true
    mark: "mark-power-with"
    wordmark: "POWER WITH"

  - id: hero
    type: landing_hero
    visible: true
    ground: obsidian
    kicker: "FREE FROM POWER WITH BY SOPHIA LIFE"
    headline: "The strategies that kept you safe are still running."
    headline_quote: true
    subhead: "Read the Introduction to Power With, free."
    body: "In the opening pages, Sophia Life gives you a language for power that changes what you are able to see. In your marriage, in your family and in every team you lead."
    list_label: "INSIDE THE INTRODUCTION"
    list:
      - "The three terms that organize every relationship you hold. Power, power over and power with."
      - "Why the qualities that drive achievement so often create distance at home."
      - "How defended patterns form, and why they come to feel like personality."
      - "Why these patterns can change, and where change begins."
    audience: "For leaders who have built a great deal and still sense something essential is out of reach. And for the people who love them."
    form:
      ground: clay
      heading: "Send me the Introduction."
      fields: [first_name, email]
      first_name_label: "FIRST NAME"
      email_label: "EMAIL ADDRESS"
      button: "SEND ME THE INTRODUCTION"
      source: "landing-top"
      helper: "Free. Arrives in your inbox today. Unsubscribe anytime."

  - id: quote
    type: quote_band
    visible: true
    ground: oxblood
    align: center
    quote: "What looks like confidence is often defense with good posture."
    attribution: "FROM POWER WITH"

  - id: author
    type: author_short
    visible: true
    ground: obsidian
    portrait: { file: "author-portrait-secondary", alt: "[Describe the chosen portrait of Sophia Life]" }
    label: "SOPHIA LIFE"
    body: "Sophia Life is an author, coach and organizational consultant. Power With is the synthesis of more than a decade of study and lived practice."

  - id: optin-bottom
    type: optin_inline
    visible: true
    ground: obsidian
    align: center
    headline: "Begin with the first pages."
    form:
      fields: [first_name, email]
      first_name_label: "FIRST NAME"
      email_label: "EMAIL ADDRESS"
      button: "SEND ME THE INTRODUCTION"
      source: "landing-bottom"

footer:
  copyright: "© 2026 SOPHIA LIFE"
  links:
    - { label: "PRIVACY", link: "/privacy" }
